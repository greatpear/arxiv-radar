name: Deployment Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.19'
          python-version: '3.11'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Run regression checks
        run: uv run --locked python -m unittest discover -s test -p test_deployment.py -v
      - name: Check command and configured arXiv feed
        run: |
          uv run --locked main.py --help
          uv run --locked python - <<'PY'
          from urllib.request import Request, urlopen
          import feedparser
          request = Request(
              'https://rss.arxiv.org/atom/cs.IT+eess.SP+physics.optics+cs.NI',
              headers={'User-Agent': 'arxiv-radar-deployment-check'},
          )
          with urlopen(request, timeout=30) as response:
              feed = feedparser.parse(response.read())
          title = feed.feed.get('title', '')
          if not title or 'Feed error for query' in title:
              raise SystemExit('The configured arXiv feed is unavailable or invalid')
          print('arXiv feed reachable:', title)
          print('Current feed entries:', len(feed.entries))
          PY
