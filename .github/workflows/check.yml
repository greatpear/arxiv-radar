name: Deployment Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_ARGS: '-DGGML_NATIVE=OFF'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  UV_NO_MANAGED_PYTHON: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.19'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --no-dev
      - name: Run regression checks
        run: |
          uv run --frozen python -m unittest discover -s test -p test_deployment.py -v
          uv run --frozen python -m unittest discover -s test -p test_daily_delivery.py -v
      - name: Check command and configured arXiv feed
        run: |
          uv run --frozen main.py --help
          uv run --frozen python - <<'PY'
          from urllib.request import Request, urlopen
          import feedparser
          from src.relevance import DEFAULT_ARXIV_QUERY
          request = Request(
              f'https://rss.arxiv.org/atom/{DEFAULT_ARXIV_QUERY}',
              headers={'User-Agent': 'arxiv-radar-deployment-check'},
          )
          with urlopen(request, timeout=30) as response:
              feed = feedparser.parse(response.read())
          title = feed.feed.get('title', '')
          if not title or 'Feed error for query' in title:
              raise SystemExit('The configured arXiv feed is unavailable or invalid')
          print('arXiv feed reachable:', title)
          print('Current feed entries:', len(feed.entries))
          PY
