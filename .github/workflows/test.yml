name: Test - Daily Paper Sender

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send the reviewed test selection by email (default saves a preview only)'
        type: boolean
        default: false

concurrency:
  group: arxiv-radar-test
  cancel-in-progress: false

env:
  CMAKE_ARGS: '-DGGML_NATIVE=OFF'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  UV_NO_MANAGED_PYTHON: 'true'

jobs:
  rank_and_send:
    name: Rank & Email
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse last run time
        id: parse_last_time
        run: |
          if [ -f ".github/keep-alive.txt" ]; then
            # Extract timestamp from the first line of keep-alive.txt
            last_time=$(grep -oP 'Last run: \K[^ ]+ [^ ]+' .github/keep-alive.txt || echo "Null")
            echo "LAST_TIME=$last_time" >> $GITHUB_ENV
            echo "Last run time found: $last_time"
          else
            echo "LAST_TIME=Null" >> $GITHUB_ENV
            echo "No keep-alive.txt file found"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.19'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Verify deployment fixes
        run: |
          uv run --frozen python -m unittest discover -s test -p test_deployment.py -v
          uv run --frozen python -m unittest discover -s test -p test_daily_delivery.py -v

      - name: Cache local language models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: arxiv-radar-models-qwen25-llama32-q4-v1

      - name: Run Script
        env:
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          RETRIEVER_TARGET: ${{ vars.RETRIEVER_TARGET }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MAX_PAPER_NUM: ${{ vars.MAX_PAPER_NUM }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          TOPIC_QUERY: ${{ vars.TOPIC_QUERY }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          LAST_TIME: ${{ env.LAST_TIME }}
          SEND_TEST_EMAIL: ${{ inputs.send_email }}
        run: |
          args=(--debug --output output/preview.html)
          if [ "$SEND_TEST_EMAIL" != "true" ]; then
            args+=(--dry_run)
          fi
          uv run --frozen main.py "${args[@]}"

      - name: Save selection for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-preview
          path: output/
          if-no-files-found: ignore
          retention-days: 7
